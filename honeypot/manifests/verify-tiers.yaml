# Apemosyne verify tiers — quick (no Docker) through nightly (full stack e2e).
tiers:
  quick:
    steps:
      - type: python
        path: test/test_production_pipeline.py
        description: Production pipeline topic routing and hot-path policy

  standard:
    extends: quick
    steps:
      - type: python
        path: scripts/verify_doctor.py
        description: Doctor preflight (no --fix)

  full:
    extends: standard
    steps:
      - type: docker
        description: Docker image present
        check: image
        image: agent_flink_image:latest

  nightly:
    extends: full
    steps:
      - type: python
        path: test/test_production_pipeline.py
        description: Production pipeline smoke (nightly placeholder)
