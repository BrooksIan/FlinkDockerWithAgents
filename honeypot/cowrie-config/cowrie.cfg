# Ratatoskr honeypot overrides (see cowrie.cfg.dist in the image for defaults)

[honeypot]
hostname = svr04
sensor_name = ratatoskr-cowrie

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
