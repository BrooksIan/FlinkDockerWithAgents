# Image: default agent_flink_image:latest (Flink Agents main / 0.3-SNAPSHOT).
# Pin stable line: flink-cowrie build release-0.2.1 then set FLINK_AGENT_IMAGE in .env
x-flink-agent-image: &flink-agent-image
  image: ${FLINK_AGENT_IMAGE:-agent_flink_image:latest}

services:
  jobmanager:
    <<: *flink-agent-image
    ports:
      - "8081:8081"
    command: jobmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    environment:
      - PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    networks:
      - flink-network

  taskmanager:
    <<: *flink-agent-image
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    volumes:
      - ./cowrie-config/injections:/opt/flink/cowrie-config/injections:ro
      - ./cowrie_normalize.py:/opt/flink/cowrie_normalize.py:ro
      - ./cowrie_actor_classify_agent.py:/opt/flink/cowrie_actor_classify_agent.py:ro
      - ./cowrie_actor_classify.py:/opt/flink/cowrie_actor_classify.py:ro
      - ./cowrie_injection_catalog.py:/opt/flink/cowrie_injection_catalog.py:ro
      - ./cowrie_phase2_agent.py:/opt/flink/cowrie_phase2_agent.py:ro
      - ./cowrie_workflow_detect.py:/opt/flink/cowrie_workflow_detect.py:ro
      - ./cowrie_policy.py:/opt/flink/cowrie_policy.py:ro
      - ./cowrie_security_alert.py:/opt/flink/cowrie_security_alert.py:ro
      - ./cowrie_counter_attack.py:/opt/flink/cowrie_counter_attack.py:ro
      - ./cowrie_block_ip.py:/opt/flink/cowrie_block_ip.py:ro
      - ./cowrie_response_tools.py:/opt/flink/cowrie_response_tools.py:ro
    environment:
      - PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip
      - COWRIE_INJECTION_CATALOG=/opt/flink/cowrie-config/injections/catalog.json
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 4096m
        taskmanager.memory.task.off-heap.size: 768m
        taskmanager.memory.framework.off-heap.size: 256m
        taskmanager.memory.jvm-metaspace.size: 512m
    networks:
      - flink-network

  # Cowrie Honeypot - Captures real SSH/Telnet attacks
  # Prompt-injection traps: cowrie-config (read-only). Dynamic disinfo: cowrie-data (writable).
  cowrie:
    image: cowrie/cowrie:latest
    ports:
      - "2222:2222"  # SSH port (exposed to internet)
      - "2223:2223"  # Telnet port (exposed to internet)
    volumes:
      - ./cowrie-logs:/cowrie/cowrie/log
      - ./cowrie-data:/cowrie/cowrie/data
      - ./cowrie-config/cowrie.cfg:/cowrie/cowrie/etc/cowrie.cfg:ro
      - ./cowrie-config/share/cowrie:/cowrie/cowrie/share/cowrie:ro
      - ./cowrie-config/honeyfs:/cowrie/cowrie/honeyfs:ro
      - ./cowrie-config/injections:/cowrie/cowrie/injections:ro
    environment:
      - COWRIE_SSH_PORT=2222
      - COWRIE_TELNET_PORT=2223
    networks:
      - flink-network
    restart: unless-stopped

  # Optional: Kafka for streaming logs
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - flink-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-broker dev config
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - flink-network

  # Kafka topics + Phase 1/1.5/2 Flink jobs (replaces kafka-topic-init + per-phase sidecars)
  flink-pipeline-supervisor:
    <<: *flink-agent-image
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    volumes:
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
      - ./cowrie_kafka_topics_startup.py:/opt/flink/cowrie_kafka_topics_startup.py:ro
      - ./cowrie_flink_jobs_startup.py:/opt/flink/cowrie_flink_jobs_startup.py:ro
      - ./cowrie_flink_pipeline_supervisor.py:/opt/flink/cowrie_flink_pipeline_supervisor.py:ro
      - ./flink_cluster_submit.py:/opt/flink/flink_cluster_submit.py:ro
      - ./cowrie_kafka_normalize_job.py:/opt/flink/cowrie_kafka_normalize_job.py:ro
      - ./cowrie_normalize.py:/opt/flink/cowrie_normalize.py:ro
      - ./cowrie_actor_classify_job.py:/opt/flink/cowrie_actor_classify_job.py:ro
      - ./cowrie_actor_classify_agent.py:/opt/flink/cowrie_actor_classify_agent.py:ro
      - ./cowrie_actor_classify.py:/opt/flink/cowrie_actor_classify.py:ro
      - ./cowrie_injection_catalog.py:/opt/flink/cowrie_injection_catalog.py:ro
      - ./cowrie-config/injections:/opt/flink/cowrie-config/injections:ro
      - ./cowrie_phase2_workflow_job.py:/opt/flink/cowrie_phase2_workflow_job.py:ro
      - ./cowrie_phase2_agent.py:/opt/flink/cowrie_phase2_agent.py:ro
      - ./cowrie_workflow_detect.py:/opt/flink/cowrie_workflow_detect.py:ro
      - ./cowrie_policy.py:/opt/flink/cowrie_policy.py:ro
      - ./cowrie_security_alert.py:/opt/flink/cowrie_security_alert.py:ro
      - ./cowrie_response_tools.py:/opt/flink/cowrie_response_tools.py:ro
      - ./demo/demo_cowrie_response.py:/opt/flink/demo/demo_cowrie_response.py:ro
      - ./cowrie_counter_attack.py:/opt/flink/cowrie_counter_attack.py:ro
      - ./cowrie_block_ip.py:/opt/flink/cowrie_block_ip.py:ro
    working_dir: /opt/flink
    command: >
      sh -c "
        export PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip &&
        export FLINK_REST_ADDRESS=jobmanager FLINK_REST_PORT=8081 &&
        python3 /opt/flink/cowrie_flink_pipeline_supervisor.py
      "
    environment:
      - PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip
      - FLINK_REST_ADDRESS=jobmanager
      - FLINK_REST_PORT=8081
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_COWRIE_TOPIC=cowrie.events
      - KAFKA_NORMALIZED_TOPIC=cowrie.normalized
      - KAFKA_NORMALIZED_ENRICHED_TOPIC=cowrie.normalized.enriched
      - KAFKA_SESSION_ACTOR_TOPIC=cowrie.session_actor
      - KAFKA_ALERTS_TOPIC=cowrie.alerts
      - KAFKA_REACT_ALERTS_TOPIC=cowrie.react_alerts
      - KAFKA_DISINFO_TOPIC=cowrie.disinfo_requests
      - COWRIE_KAFKA_TOPIC=cowrie.alerts
      - COWRIE_KAFKA_REACT_TOPIC=cowrie.react_alerts
      - KAFKA_AUTO_OFFSET_RESET=latest
      - COWRIE_ACTOR_CLASSIFY=1
      - COWRIE_ACTOR_TIMING_THRESHOLD_SEC=1.7
      - COWRIE_INJECTION_CATALOG=/opt/flink/cowrie-config/injections/catalog.json
      - COWRIE_COUNTER_ATTACK_ENGINE=workflow
      - COWRIE_PHASE2_ENGINE=${COWRIE_PHASE2_ENGINE:-pure_python}
      - COWRIE_KAFKA_TOPIC_WATCH_INTERVAL=60
      - COWRIE_FLINK_WATCH_INTERVAL=30
    networks:
      - flink-network
    restart: unless-stopped

  # Legacy per-phase sidecars (opt-in: docker compose --profile legacy-sidecars up -d)
  kafka-topic-init:
    profiles:
      - legacy-sidecars
    <<: *flink-agent-image
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
      - ./cowrie_kafka_topics_startup.py:/opt/flink/cowrie_kafka_topics_startup.py:ro
    working_dir: /opt/flink
    command: >
      sh -c "python3 /opt/flink/cowrie_kafka_topics_startup.py"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_COWRIE_TOPIC=cowrie.events
      - KAFKA_NORMALIZED_TOPIC=cowrie.normalized
      - KAFKA_NORMALIZED_ENRICHED_TOPIC=cowrie.normalized.enriched
      - KAFKA_SESSION_ACTOR_TOPIC=cowrie.session_actor
      - KAFKA_ALERTS_TOPIC=cowrie.alerts
      - KAFKA_REACT_ALERTS_TOPIC=cowrie.react_alerts
      - KAFKA_DISINFO_TOPIC=cowrie.disinfo_requests
      - COWRIE_KAFKA_TOPIC=cowrie.alerts
      - COWRIE_KAFKA_REACT_TOPIC=cowrie.react_alerts
      - COWRIE_KAFKA_TOPIC_WATCH_INTERVAL=60
    networks:
      - flink-network
    restart: unless-stopped

  kafka-normalizer:
    profiles:
      - legacy-sidecars
    <<: *flink-agent-image
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      kafka-topic-init:
        condition: service_started
      cowrie-kafka-shipper:
        condition: service_started
    volumes:
      - ./cowrie_kafka_normalize_job.py:/opt/flink/cowrie_kafka_normalize_job.py:ro
      - ./cowrie_normalize.py:/opt/flink/cowrie_normalize.py:ro
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
      - ./cowrie_kafka_topics_startup.py:/opt/flink/cowrie_kafka_topics_startup.py:ro
      - ./flink_cluster_submit.py:/opt/flink/flink_cluster_submit.py:ro
      - ./cowrie_flink_jobs_startup.py:/opt/flink/cowrie_flink_jobs_startup.py:ro
      - ./cowrie_kafka_normalizer.py:/opt/flink/cowrie_kafka_normalizer.py:ro
    working_dir: /opt/flink
    command: >
      sh -c "
        if [ \"$${PHASE1_PYTHON_NORMALIZER:-0}\" = \"1\" ]; then
          python3 /opt/flink/cowrie_kafka_normalizer.py;
        else
          export PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip &&
          export FLINK_REST_ADDRESS=jobmanager FLINK_REST_PORT=8081 &&
          export KAFKA_BOOTSTRAP_SERVERS=kafka:9092 &&
          export KAFKA_COWRIE_TOPIC=cowrie.events &&
          export KAFKA_NORMALIZED_TOPIC=cowrie.normalized &&
          export KAFKA_AUTO_OFFSET_RESET=latest &&
          python3 /opt/flink/cowrie_flink_jobs_startup.py --phase 1;
        fi
      "
    environment:
      - PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip
      - FLINK_REST_ADDRESS=jobmanager
      - FLINK_REST_PORT=8081
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_COWRIE_TOPIC=cowrie.events
      - KAFKA_NORMALIZED_TOPIC=cowrie.normalized
      - KAFKA_GROUP_ID=cowrie-normalize-flink
      - KAFKA_AUTO_OFFSET_RESET=latest
    networks:
      - flink-network
    restart: unless-stopped

  kafka-actor-classifier:
    profiles:
      - legacy-sidecars
    <<: *flink-agent-image
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      kafka:
        condition: service_started
      kafka-normalizer:
        condition: service_started
      kafka-topic-init:
        condition: service_started
    volumes:
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
      - ./cowrie_kafka_topics_startup.py:/opt/flink/cowrie_kafka_topics_startup.py:ro
      - ./cowrie_actor_classify_job.py:/opt/flink/cowrie_actor_classify_job.py:ro
      - ./cowrie_actor_classify_agent.py:/opt/flink/cowrie_actor_classify_agent.py:ro
      - ./cowrie_actor_classify.py:/opt/flink/cowrie_actor_classify.py:ro
      - ./cowrie_injection_catalog.py:/opt/flink/cowrie_injection_catalog.py:ro
      - ./cowrie-config/injections:/opt/flink/cowrie-config/injections:ro
      - ./flink_cluster_submit.py:/opt/flink/flink_cluster_submit.py:ro
      - ./cowrie_flink_jobs_startup.py:/opt/flink/cowrie_flink_jobs_startup.py:ro
      - ./cowrie_kafka_normalize_job.py:/opt/flink/cowrie_kafka_normalize_job.py:ro
      - ./cowrie_normalize.py:/opt/flink/cowrie_normalize.py:ro
      - ./cowrie_kafka_actor_classifier.py:/opt/flink/cowrie_kafka_actor_classifier.py:ro
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
    working_dir: /opt/flink
    command: >
      sh -c "
        run_python_sidecar() {
          export PYTHONPATH=/opt/flink &&
          export KAFKA_GROUP_ID=$${KAFKA_ACTOR_PYTHON_GROUP_ID:-cowrie-actor-classify-python} &&
          export COWRIE_INJECTION_CATALOG=/opt/flink/cowrie-config/injections/catalog.json &&
          echo 'Phase 1.5 Python actor classifier running (Kafka sidecar)' &&
          python3 /opt/flink/cowrie_kafka_actor_classifier.py;
        };
        if [ \"$${PHASE15_PYTHON_CLASSIFIER:-0}\" != \"1\" ]; then
          export PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip &&
          export FLINK_REST_ADDRESS=jobmanager FLINK_REST_PORT=8081 &&
          export KAFKA_BOOTSTRAP_SERVERS=kafka:9092 &&
          export KAFKA_NORMALIZED_TOPIC=cowrie.normalized &&
          export KAFKA_NORMALIZED_ENRICHED_TOPIC=cowrie.normalized.enriched &&
          export KAFKA_SESSION_ACTOR_TOPIC=cowrie.session_actor &&
          export COWRIE_INJECTION_CATALOG=/opt/flink/cowrie-config/injections/catalog.json &&
          export COWRIE_ACTOR_TIMING_THRESHOLD_SEC=1.7 &&
          if python3 /opt/flink/cowrie_flink_jobs_startup.py --phase 1.5; then
            echo 'Phase 1.5 Flink job running — see http://localhost:8081';
          else
            echo 'Phase 1.5 Flink submit failed (often no free TaskManager slots). Falling back to Python sidecar.' &&
            run_python_sidecar;
          fi;
        else
          run_python_sidecar;
        fi
      "
    environment:
      - PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip
      - FLINK_REST_ADDRESS=jobmanager
      - FLINK_REST_PORT=8081
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_NORMALIZED_TOPIC=cowrie.normalized
      - KAFKA_NORMALIZED_ENRICHED_TOPIC=cowrie.normalized.enriched
      - KAFKA_SESSION_ACTOR_TOPIC=cowrie.session_actor
      - KAFKA_GROUP_ID=cowrie-actor-classify-flink
      - KAFKA_ACTOR_PYTHON_GROUP_ID=cowrie-actor-classify-python
      - KAFKA_AUTO_OFFSET_RESET=latest
      - COWRIE_ACTOR_CLASSIFY=1
      - COWRIE_ACTOR_TIMING_THRESHOLD_SEC=1.7
      - COWRIE_INJECTION_CATALOG=/opt/flink/cowrie-config/injections/catalog.json
    networks:
      - flink-network
    restart: unless-stopped

  kafka-workflow-processor:
    profiles:
      - legacy-sidecars
    <<: *flink-agent-image
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      kafka:
        condition: service_started
      kafka-normalizer:
        condition: service_started
      kafka-actor-classifier:
        condition: service_started
      kafka-topic-init:
        condition: service_started
    volumes:
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
      - ./cowrie_kafka_topics_startup.py:/opt/flink/cowrie_kafka_topics_startup.py:ro
      - ./cowrie_phase2_workflow_job.py:/opt/flink/cowrie_phase2_workflow_job.py:ro
      - ./cowrie_phase2_agent.py:/opt/flink/cowrie_phase2_agent.py:ro
      - ./cowrie_workflow_detect.py:/opt/flink/cowrie_workflow_detect.py:ro
      - ./cowrie_policy.py:/opt/flink/cowrie_policy.py:ro
      - ./cowrie_security_alert.py:/opt/flink/cowrie_security_alert.py:ro
      - ./cowrie_response_tools.py:/opt/flink/cowrie_response_tools.py:ro
      - ./flink_cluster_submit.py:/opt/flink/flink_cluster_submit.py:ro
      - ./cowrie_flink_jobs_startup.py:/opt/flink/cowrie_flink_jobs_startup.py:ro
      - ./cowrie_kafka_normalize_job.py:/opt/flink/cowrie_kafka_normalize_job.py:ro
      - ./cowrie_normalize.py:/opt/flink/cowrie_normalize.py:ro
      - ./cowrie_actor_classify_job.py:/opt/flink/cowrie_actor_classify_job.py:ro
      - ./cowrie_actor_classify_agent.py:/opt/flink/cowrie_actor_classify_agent.py:ro
      - ./cowrie_actor_classify.py:/opt/flink/cowrie_actor_classify.py:ro
      - ./cowrie_injection_catalog.py:/opt/flink/cowrie_injection_catalog.py:ro
      - ./demo/demo_cowrie_response.py:/opt/flink/demo/demo_cowrie_response.py:ro
      - ./cowrie_counter_attack.py:/opt/flink/cowrie_counter_attack.py:ro
      - ./cowrie_block_ip.py:/opt/flink/cowrie_block_ip.py:ro
      - ./cowrie_phase2_workflow_processor.py:/opt/flink/cowrie_phase2_workflow_processor.py:ro
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
      - ./cowrie-dashboard-data.json:/opt/flink/cowrie-dashboard-data.json:rw
    working_dir: /opt/flink
    command: >
      sh -c "
        if [ \"$${PHASE2_PYTHON_PROCESSOR:-0}\" = \"1\" ]; then
          export PYTHONPATH=/opt/flink/pythonpath/agent-site-packages:/opt/flink &&
          python3 /opt/flink/cowrie_phase2_workflow_processor.py;
        else
          export PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip &&
          export FLINK_REST_ADDRESS=jobmanager FLINK_REST_PORT=8081 &&
          export COWRIE_COUNTER_ATTACK_ENGINE=workflow &&
          export COWRIE_PHASE2_ENGINE=$${COWRIE_PHASE2_ENGINE:-pure_python} &&
          export KAFKA_BOOTSTRAP_SERVERS=kafka:9092 &&
          export COWRIE_ACTOR_CLASSIFY=$${COWRIE_ACTOR_CLASSIFY:-1} &&
          export KAFKA_NORMALIZED_TOPIC=cowrie.normalized &&
          export KAFKA_NORMALIZED_ENRICHED_TOPIC=cowrie.normalized.enriched &&
          export KAFKA_ALERTS_TOPIC=cowrie.alerts &&
          export KAFKA_AUTO_OFFSET_RESET=latest &&
          python3 /opt/flink/cowrie_flink_jobs_startup.py --phase 2;
        fi
      "
    environment:
      - PYTHONPATH=/opt/flink:/opt/flink/pythonpath/agent-site-packages:/opt/flink/opt/python/pyflink.zip:/opt/flink/opt/python/py4j-src.zip
      - FLINK_REST_ADDRESS=jobmanager
      - FLINK_REST_PORT=8081
      - COWRIE_COUNTER_ATTACK_ENGINE=workflow
      - COWRIE_PHASE2_ENGINE=${COWRIE_PHASE2_ENGINE:-pure_python}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_NORMALIZED_TOPIC=cowrie.normalized
      - KAFKA_NORMALIZED_ENRICHED_TOPIC=cowrie.normalized.enriched
      - KAFKA_ALERTS_TOPIC=cowrie.alerts
      - KAFKA_GROUP_ID=cowrie-workflow-flink
      - KAFKA_AUTO_OFFSET_RESET=latest
      - COWRIE_ACTOR_CLASSIFY=1
      - COWRIE_DASHBOARD_JSON=/opt/flink/cowrie-dashboard-data.json
    networks:
      - flink-network
    restart: unless-stopped

  # Phase 3: Cloudera ReAct augmentation on normalized stream
  kafka-react-augmentor:
    <<: *flink-agent-image
    depends_on:
      kafka:
        condition: service_healthy
      flink-pipeline-supervisor:
        condition: service_started
    env_file:
      - ./.env
    volumes:
      - ./cowrie_phase3_react_augmentor.py:/opt/flink/cowrie_phase3_react_augmentor.py:ro
      - ./cowrie_phase3_summary_agent.py:/opt/flink/cowrie_phase3_summary_agent.py:ro
      - ./mcp_threat_intel.py:/opt/flink/mcp_threat_intel.py:ro
      - ./cowrie_durable_tools.py:/opt/flink/cowrie_durable_tools.py:ro
      - ./cowrie_workflow_detect.py:/opt/flink/cowrie_workflow_detect.py:ro
      - ./cowrie_policy.py:/opt/flink/cowrie_policy.py:ro
      - ./cowrie_normalize.py:/opt/flink/cowrie_normalize.py:ro
      - ./demo/demo_cloudera_react_agent.py:/opt/flink/demo_cloudera_react_agent.py:ro
      - ./react_counter_attack_tools.py:/opt/flink/react_counter_attack_tools.py:ro
      - ./react_counter_attack_executor.py:/opt/flink/react_counter_attack_executor.py:ro
      - ./react_response_executor.py:/opt/flink/react_response_executor.py:ro
      - ./cowrie_security_alert.py:/opt/flink/cowrie_security_alert.py:ro
      - ./react_dashboard_bridge.py:/opt/flink/react_dashboard_bridge.py:ro
      - ./cowrie_policy.py:/opt/flink/cowrie_policy.py:ro
      - ./cloudera_llm_config.py:/opt/flink/cloudera_llm_config.py:ro
      - ./cloudera_react_llm.py:/opt/flink/cloudera_react_llm.py:ro
      - ./cloudera_misinformation_llm.py:/opt/flink/cloudera_misinformation_llm.py:ro
      - ./cowrie_counter_attack.py:/opt/flink/cowrie_counter_attack.py:ro
      - ./cowrie_block_ip.py:/opt/flink/cowrie_block_ip.py:ro
      - ./cowrie-data:/cowrie/cowrie/data:rw
      - ./cowrie_disinfo_publish.py:/opt/flink/cowrie_disinfo_publish.py:ro
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
      - ./cowrie-dashboard-data.json:/opt/flink/cowrie-dashboard-data.json:rw
      - ./kafka_alerts_to_dashboard.py:/opt/flink/kafka_alerts_to_dashboard.py:ro
      - ./requirements.txt:/opt/flink/requirements.txt:ro
    working_dir: /opt/flink
    command: >
      sh -c "
        export PYTHONPATH=/opt/flink/pythonpath/agent-site-packages:/opt/flink &&
        if python3 -c 'from cowrie_phase3_react_augmentor import cloudera_config_ok; import sys; sys.exit(0 if cloudera_config_ok() else 2)'; then
          python3 /opt/flink/cowrie_phase3_react_augmentor.py;
        else
          echo 'Phase 3 skipped: set CLOUDERA_AI_BASE_URL and CLOUDERA_JWT_TOKEN in .env' &&
          sleep infinity;
        fi
      "
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_NORMALIZED_TOPIC=cowrie.normalized
      - KAFKA_NORMALIZED_ENRICHED_TOPIC=cowrie.normalized.enriched
      - KAFKA_REACT_ALERTS_TOPIC=cowrie.react_alerts
      - KAFKA_GROUP_ID=cowrie-react
      - KAFKA_AUTO_OFFSET_RESET=latest
      - COWRIE_ACTOR_CLASSIFY=1
      - COWRIE_DISINFO_KAFKA=1
      - KAFKA_DISINFO_TOPIC=cowrie.disinfo_requests
      - COWRIE_DASHBOARD_JSON=/opt/flink/cowrie-dashboard-data.json
      - REACT_HISTORY_MAX=25
      - REACT_HISTORY_PROMPT_EVENTS=12
      - COWRIE_REACT_EXECUTE_COUNTER_ATTACKS=1
      - COWRIE_REACT_EXECUTE_RESPONSE_ACTIONS=1
      - COWRIE_REACT_EXECUTE_BLOCK_IP=1
      - COWRIE_DATA_DIR=/cowrie/cowrie/data
      - COWRIE_PHASE3_SUMMARY=${COWRIE_PHASE3_SUMMARY:-0}
      - COWRIE_PHASE3_SUMMARY_MIN_SEVERITY=${COWRIE_PHASE3_SUMMARY_MIN_SEVERITY:-CRITICAL}
      - COWRIE_PHASE3_SUMMARY_SAMPLE_RATE=${COWRIE_PHASE3_SUMMARY_SAMPLE_RATE:-1.0}
      - COWRIE_MCP_THREAT_INTEL=${COWRIE_MCP_THREAT_INTEL:-0}
      - COWRIE_MCP_THREAT_INTEL_SOURCE=${COWRIE_MCP_THREAT_INTEL_SOURCE:-abuseipdb}
      - COWRIE_DURABLE_TOOLS=${COWRIE_DURABLE_TOOLS:-0}
    networks:
      - flink-network
    restart: unless-stopped

  # Apply dynamic honeypot misinformation (LLM decoys → honeyfs / txtcmds)
  cowrie-disinfo-applier:
    <<: *flink-agent-image
    depends_on:
      - kafka
      - cowrie
    volumes:
      - ./cowrie_disinfo_applier.py:/opt/flink/cowrie_disinfo_applier.py:ro
      - ./cowrie-data:/cowrie/cowrie/data
    working_dir: /opt/flink
    command: >
      sh -c "
        export COWRIE_DATA_ROOT=/cowrie/cowrie/data &&
        python3 /opt/flink/cowrie_disinfo_applier.py
      "
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_DISINFO_TOPIC=cowrie.disinfo_requests
      - KAFKA_GROUP_ID=cowrie-disinfo-applier
      - KAFKA_AUTO_OFFSET_RESET=latest
      - COWRIE_DATA_ROOT=/cowrie/cowrie/data
    networks:
      - flink-network
    restart: unless-stopped

  # Ship Cowrie file logs into Kafka (cowrie.events)
  cowrie-kafka-shipper:
    <<: *flink-agent-image
    depends_on:
      cowrie:
        condition: service_started
      kafka:
        condition: service_healthy
    volumes:
      - ./cowrie-logs:/cowrie/cowrie/log:ro
      - ./cowrie_kafka_shipper.py:/opt/flink/cowrie_kafka_shipper.py:ro
      - ./cowrie_phase1_verify.py:/opt/flink/cowrie_phase1_verify.py:ro
    working_dir: /opt/flink
    command: >
      sh -c "python3 /opt/flink/cowrie_kafka_shipper.py"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_COWRIE_TOPIC=cowrie.events
      - COWRIE_LOG_FILE=/cowrie/cowrie/log/cowrie.json
      - COWRIE_SHIPPER_START_AT_END=1
    networks:
      - flink-network
    restart: unless-stopped

  # Legacy: single Flink job on normalized → cowrie.alerts (duplicates Phase 2). Opt-in only.
  kafka-flink-job:
    profiles:
      - legacy
    <<: *flink-agent-image
    depends_on:
      - jobmanager
      - taskmanager
      - kafka
    volumes:
      - ./cowrie_kafka_flink_job.py:/opt/flink/cowrie_kafka_flink_job.py:ro
      - ./demo/demo_cowrie_response.py:/opt/flink/demo_cowrie_response.py:ro
      - ./demo/demo_cloudera_react_agent.py:/opt/flink/demo_cloudera_react_agent.py:ro
      - ./react_counter_attack_tools.py:/opt/flink/react_counter_attack_tools.py:ro
      - ./react_counter_attack_executor.py:/opt/flink/react_counter_attack_executor.py:ro
      - ./react_response_executor.py:/opt/flink/react_response_executor.py:ro
      - ./cowrie_security_alert.py:/opt/flink/cowrie_security_alert.py:ro
      - ./react_dashboard_bridge.py:/opt/flink/react_dashboard_bridge.py:ro
      - ./cowrie_policy.py:/opt/flink/cowrie_policy.py:ro
      - ./cloudera_llm_config.py:/opt/flink/cloudera_llm_config.py:ro
      - ./cloudera_react_llm.py:/opt/flink/cloudera_react_llm.py:ro
      - ./cloudera_misinformation_llm.py:/opt/flink/cloudera_misinformation_llm.py:ro
    working_dir: /opt/flink
    command: >
      sh -c "
        set -e &&
        FLINK_VER=$$(ls /opt/flink/lib/flink-dist-*.jar | head -1 | xargs -n1 basename | sed 's/^flink-dist-//' | sed 's/\\.jar$$//') &&
        # Kafka connector versions are decoupled from Flink core in Flink 2.x.
        # For Flink 2.2.x, use flink-connector-kafka 4.0.x-2.0.
        CONN_VER=$$(echo $$FLINK_VER | awk -F. '{ if ($$1==2) print \"4.0.1-2.0\"; else print $$0 }') &&
        KAFKA_JAR=/opt/flink/lib/flink-connector-kafka-$${CONN_VER}.jar &&
        echo \"Ensuring Kafka connector jar: $$KAFKA_JAR\" &&
        curl -fsSL \"https://repo1.maven.org/maven2/org/apache/flink/flink-connector-kafka/$${CONN_VER}/flink-connector-kafka-$${CONN_VER}.jar\" -o \"$$KAFKA_JAR\" &&
        ls -lh \"$$KAFKA_JAR\" &&
        export PYFLINK_CLASSPATH=\"$$KAFKA_JAR\" &&
        export PYTHONPATH=/opt/flink/pythonpath/agent-site-packages &&
        /opt/flink/flink-agents/python/.venv/bin/python3 /opt/flink/cowrie_kafka_flink_job.py
      "
    environment:
      - PYTHONPATH=/opt/flink/pythonpath/agent-site-packages
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_COWRIE_TOPIC=cowrie.normalized
      - KAFKA_ALERTS_TOPIC=cowrie.alerts
      - KAFKA_GROUP_ID=flink-agents-cowrie
      - KAFKA_AUTO_OFFSET_RESET=latest
      - COWRIE_COUNTER_ATTACK_ENGINE=auto
    networks:
      - flink-network
    restart: unless-stopped

  # Merge Phase 2 + Phase 3 Kafka alerts into dashboard JSON
  kafka-alerts-to-dashboard:
    <<: *flink-agent-image
    depends_on:
      kafka:
        condition: service_healthy
      flink-pipeline-supervisor:
        condition: service_started
      kafka-react-augmentor:
        condition: service_started
    volumes:
      - ./cowrie-dashboard-data.json:/opt/flink/cowrie-dashboard-data.json:rw
      - ./kafka_alerts_to_dashboard.py:/opt/flink/kafka_alerts_to_dashboard.py:ro
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
    working_dir: /opt/flink
    command: >
      sh -c "python3 /opt/flink/kafka_alerts_to_dashboard.py"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ALERTS_TOPICS=cowrie.alerts,cowrie.react_alerts
      - KAFKA_ALERTS_GROUP_ID=dashboard-writer
      - KAFKA_AUTO_OFFSET_RESET=latest
      - COWRIE_DASHBOARD_JSON=/opt/flink/cowrie-dashboard-data.json
    networks:
      - flink-network
    restart: unless-stopped

  # Real-time Cowrie Log Processor
  log-processor:
    <<: *flink-agent-image
    depends_on:
      - cowrie
      - jobmanager
    env_file:
      - ./.env
    volumes:
      - ./cowrie-logs:/cowrie/cowrie/log:ro
      - ./cowrie-dashboard-data.json:/opt/flink/cowrie-dashboard-data.json:rw
      - ./cowrie_log_processor.py:/opt/flink/cowrie_log_processor.py:ro
      - ./demo/demo_cowrie_response.py:/opt/flink/demo_cowrie_response.py:ro
      - ./demo/demo_cloudera_react_agent.py:/opt/flink/demo_cloudera_react_agent.py:ro
      - ./react_counter_attack_tools.py:/opt/flink/react_counter_attack_tools.py:ro
      - ./react_counter_attack_executor.py:/opt/flink/react_counter_attack_executor.py:ro
      - ./react_response_executor.py:/opt/flink/react_response_executor.py:ro
      - ./cowrie_security_alert.py:/opt/flink/cowrie_security_alert.py:ro
      - ./react_dashboard_bridge.py:/opt/flink/react_dashboard_bridge.py:ro
      - ./cowrie_policy.py:/opt/flink/cowrie_policy.py:ro
      - ./cloudera_llm_config.py:/opt/flink/cloudera_llm_config.py:ro
      - ./cloudera_react_llm.py:/opt/flink/cloudera_react_llm.py:ro
      - ./cloudera_misinformation_llm.py:/opt/flink/cloudera_misinformation_llm.py:ro
      - ./cowrie_block_ip.py:/opt/flink/cowrie_block_ip.py:ro
      - ./cowrie_counter_attack.py:/opt/flink/cowrie_counter_attack.py:ro
      - ./cowrie-data:/cowrie/cowrie/data:rw
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
    working_dir: /opt/flink
    command: >
      sh -c "python3 /opt/flink/cowrie_log_processor.py --log-file /cowrie/cowrie/log/cowrie.json --dashboard-file /opt/flink/cowrie-dashboard-data.json"
    environment:
      - COWRIE_USE_FLINK_CLUSTER=1
      # Hot path: workflow only — ReAct runs async in kafka-react-augmentor (Phase 3)
      - COWRIE_HOT_PATH_ENGINE=workflow
      - COWRIE_COUNTER_ATTACK_ENGINE=workflow
      - REACT_LLM_BACKEND=cloudera
      - COWRIE_DASHBOARD_DEDUPE=1
      - COWRIE_DASHBOARD_MAX_ALERTS=2000
      # Production split: Phase 2/3 sidecars own Kafka topics; log-processor → dashboard only
      - COWRIE_KAFKA_PIPELINE=1
      - COWRIE_KAFKA_ENABLED=0
      - COWRIE_KAFKA_BOOTSTRAP=kafka:9092
      - COWRIE_KAFKA_TOPIC=cowrie.alerts
      - COWRIE_KAFKA_REACT_TOPIC=cowrie.react_alerts
      - FLINK_JOBMANAGER_HOST=jobmanager
      - FLINK_JOBMANAGER_RPC_PORT=6123
      - COWRIE_REACT_EXECUTE_COUNTER_ATTACKS=1
      - COWRIE_REACT_EXECUTE_RESPONSE_ACTIONS=1
      - COWRIE_REACT_EXECUTE_BLOCK_IP=1
      - COWRIE_DATA_DIR=/cowrie/cowrie/data
    networks:
      - flink-network
    restart: unless-stopped

  # Threat Detection Dashboard
  dashboard:
    <<: *flink-agent-image
    ports:
      - "8501:8501"
    depends_on:
      - log-processor
      - kafka
    env_file:
      - ./.env
    volumes:
      # cloudera_llm_config.py loads project-root .env from /opt/flink/.env (belt-and-suspenders with env_file)
      - ./.env:/opt/flink/.env:ro
      - ./dashboard-data:/opt/flink/dashboard-data
      - ./cowrie-dashboard-data.json:/opt/flink/cowrie-dashboard-data.json:rw
      - ./requirements.txt:/opt/flink/requirements.txt:ro
      - ./dashboard/dashboard_cowrie.py:/opt/flink/dashboard_cowrie.py:ro
      - ./cowrie_log_processor.py:/opt/flink/cowrie_log_processor.py:ro
      - ./demo/demo_cowrie_response.py:/opt/flink/demo_cowrie_response.py:ro
      - ./demo/demo_cloudera_react_agent.py:/opt/flink/demo_cloudera_react_agent.py:ro
      - ./react_counter_attack_tools.py:/opt/flink/react_counter_attack_tools.py:ro
      - ./react_counter_attack_executor.py:/opt/flink/react_counter_attack_executor.py:ro
      - ./react_response_executor.py:/opt/flink/react_response_executor.py:ro
      - ./cowrie_security_alert.py:/opt/flink/cowrie_security_alert.py:ro
      - ./react_dashboard_bridge.py:/opt/flink/react_dashboard_bridge.py:ro
      - ./cowrie_policy.py:/opt/flink/cowrie_policy.py:ro
      - ./react_agent_ui_test.py:/opt/flink/react_agent_ui_test.py:ro
      - ./cowrie_pipeline.py:/opt/flink/cowrie_pipeline.py:ro
      - ./cowrie_block_ip.py:/opt/flink/cowrie_block_ip.py:ro
      - ./cowrie_counter_attack.py:/opt/flink/cowrie_counter_attack.py:ro
      - ./cowrie_normalize.py:/opt/flink/cowrie_normalize.py:ro
      - ./cowrie_workflow_detect.py:/opt/flink/cowrie_workflow_detect.py:ro
      - ./cowrie_policy.py:/opt/flink/cowrie_policy.py:ro
      - ./cloudera_llm_config.py:/opt/flink/cloudera_llm_config.py:ro
      - ./cloudera_react_llm.py:/opt/flink/cloudera_react_llm.py:ro
      - ./cloudera_misinformation_llm.py:/opt/flink/cloudera_misinformation_llm.py:ro
      - ./mcp_threat_intel.py:/opt/flink/mcp_threat_intel.py:ro
      - ./cowrie-data:/cowrie/cowrie/data:rw
    working_dir: /opt/flink
    command: >
      sh -c "
        if [ ! -f /opt/flink/cowrie-dashboard-data.json ]; then
          echo '[]' > /opt/flink/cowrie-dashboard-data.json
        fi &&
        python3 -m streamlit run dashboard_cowrie.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
      "
    environment:
      - COWRIE_USE_FLINK_CLUSTER=0
      - COWRIE_COUNTER_ATTACK_ENGINE=auto
      - REACT_LLM_BACKEND=cloudera
      # Default Kafka settings for the UI (optional)
      - COWRIE_KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_SESSION_ACTOR_TOPIC=cowrie.session_actor
      - KAFKA_NORMALIZED_ENRICHED_TOPIC=cowrie.normalized.enriched
      - FLINK_REST_ADDRESS=jobmanager
      - FLINK_REST_PORT=8081
      - COWRIE_REACT_EXECUTE_COUNTER_ATTACKS=1
      - COWRIE_REACT_EXECUTE_RESPONSE_ACTIONS=1
      - COWRIE_REACT_EXECUTE_BLOCK_IP=1
      - COWRIE_DATA_DIR=/cowrie/cowrie/data
    networks:
      - flink-network
    restart: unless-stopped

networks:
  flink-network:
    driver: bridge

