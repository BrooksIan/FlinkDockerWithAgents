# Ratatoskr verify tiers — generic workspace checks (no honeypot required).
tiers:
  quick:
    steps:
      - type: python
        path: test/test_cli_smoke.py
        description: Workspace layout, manifests, and CLI catalog smoke
      - type: python
        path: test/test_generic_platform.py
        description: Generic agent registry and validate paths (no honeypot)

  standard:
    extends: quick
    steps:
      - type: python
        path: test/test_api_platform.py
        description: Control API OpenAPI, health, metrics, and auth smoke
      - type: python
        path: test/test_runs_platform.py
        description: Agent run registry and /v1/runs API
      - type: python
        path: test/test_pipelines_platform.py
        description: Agentic Studio pipelines and /v1/pipelines API
      - type: python
        path: scripts/verify_doctor.py
        description: Doctor preflight (no --fix)

  full:
    extends: standard
    steps:
      - type: docker
        description: Docker image present
        check: image
        image: agent_flink_image:latest

  nightly:
    extends: full
    steps:
      - type: python
        path: test/test_cli_smoke.py
        description: Repeat workspace smoke after image check
