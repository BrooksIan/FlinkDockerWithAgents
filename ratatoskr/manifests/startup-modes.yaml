default: flink
modes:
  flink:
    description: Minimal Flink JobManager + TaskManager (generic demos)
    profile: minimal
    wait: 10
    run_doctor: true
    build_image_if_missing: false
    ensure_kafka_topics: false
    ensure_flink_jobs: false
    endpoints:
      - "Flink Web UI: http://localhost:8082"

  platform:
    description: Minimal Flink stack + control API for dashboards
    profile: minimal
    wait: 15
    run_doctor: true
    build_image_if_missing: true
    ensure_kafka_topics: false
    ensure_flink_jobs: false
    endpoints:
      - "Flink Web UI: http://localhost:8082"
      - "Control API: http://127.0.0.1:8090/docs"

  platform-ui:
    description: Minimal Flink stack + control API + React dashboard (dev)
    profile: minimal
    wait: 15
    run_doctor: true
    build_image_if_missing: true
    ensure_kafka_topics: false
    ensure_flink_jobs: false
    endpoints:
      - "Flink Web UI: http://localhost:8082"
      - "Control API: http://127.0.0.1:8090/docs"
      - "Dashboard: http://localhost:3000 (npm run dev in dashboard/)"

  honeypot:
    description: Full Cowrie honeypot + Kafka + dashboard pipeline
    profile: full
    wait: 30
    run_doctor: true
    build_image_if_missing: true
    ensure_kafka_topics: true
    ensure_flink_jobs: true
    endpoints:
      - "Flink Web UI: http://localhost:8081"
      - "Dashboard: http://localhost:8501"
      - "Cowrie SSH: localhost:2222"
