[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apemosyne"
version = "0.1.0"
description = "CLI for Apache Flink Agents workspaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "plotly>=5.17.0",
    "kafka-python>=2.0.2",
    "ipwhois>=1.2.0",
    "openai>=1.0.0",
    "requests>=2.28.0",
]

[project.scripts]
apemosyne = "apemosyne.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apemosyne*"]
